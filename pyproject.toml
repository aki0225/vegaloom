[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vegaloom"
version = "0.1.1"
description = "One writes, one reviews — an isolated-context runner for coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
vega = "vega.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vega = ["resources/loops/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".tmp/ruff/cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".tmp/pytest/cache"
