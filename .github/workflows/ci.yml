name: 持续集成

"on":
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_experimental: ${{ steps.experimental_scope.outputs.run_experimental }}
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"

      - name: 编译与静态检查
        run: |
          python -m compileall src scripts
          ruff check src tests scripts

      - name: 检查仓库路径与私密文件卫生
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            python scripts/check_repository_hygiene.py --base-ref "$base_sha"
          else
            python scripts/check_repository_hygiene.py
          fi

      - name: 检查版本化计划状态
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            python scripts/plan_state.py check --base-ref "$base_sha"
          else
            python scripts/plan_state.py check
          fi

      - name: 检查架构复杂度与实验依赖增量
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            python scripts/check_architecture_growth.py --base-ref "$base_sha"
          else
            python scripts/check_architecture_growth.py --base-ref HEAD
          fi

      - name: 检查本次提交范围的空白错误
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            git diff --check "${base_sha}..HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: 核对测试职责目录
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          allowed_groups = {"core", "experimental", "security", "supervisor"}
          frozen_root_test = Path("tests/test_crwp_v1_control.py")
          invalid = []
          for path in Path("tests").rglob("test_*.py"):
              relative = path.relative_to("tests")
              if len(relative.parts) == 1:
                  if path != frozen_root_test:
                      invalid.append(path.as_posix())
              elif relative.parts[0] not in allowed_groups:
                  invalid.append(path.as_posix())
          if invalid:
              raise SystemExit(f"测试文件未归入职责目录：{sorted(invalid)}")
          if not frozen_root_test.is_file():
              raise SystemExit("冻结控制测试路径缺失")
          experimental_imports = []
          for path in Path("tests/core").rglob("test_*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      module = node.module or ""
                      if module == "vega.experimental" or module.startswith(
                          "vega.experimental."
                      ):
                          experimental_imports.append(
                              f"{path.as_posix()}:{node.lineno}:{module}"
                          )
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name == "vega.experimental" or alias.name.startswith(
                              "vega.experimental."
                          ):
                              experimental_imports.append(
                                  f"{path.as_posix()}:{node.lineno}:{alias.name}"
                              )
          if experimental_imports:
              raise SystemExit(
                  "Core 测试不得静态导入 Experimental："
                  f"{sorted(experimental_imports)}"
              )
          print("测试文件均位于已登记职责目录")
          PY

      - name: 判定是否需要运行实验测试
        id: experimental_scope
        shell: bash
        run: |
          run_experimental=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            run_experimental=false
            base_sha="${{ github.event.pull_request.base.sha }}"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/*|pyproject.toml|tests/conftest.py|src/vega/experimental/*|tests/experimental/*|tests/test_crwp_v1_control.py|eval/*|examples/evidence/*|site/*|scripts/build_showcase_data.py|scripts/dogfood_eval.py|scripts/pilot/*|scripts/rcb01_*|scripts/run_assurance_*)
                  run_experimental=true
                  break
                  ;;
              esac
            done < <(git diff --name-only -z --diff-filter=ACMRT "$base_sha..HEAD")
          fi
          echo "run_experimental=$run_experimental" >> "$GITHUB_OUTPUT"

  tests-py311:
    name: Python 3.11 兼容性
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 获取展示站发布证据 Tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: git fetch --no-tags origin refs/tags/v0.2.0:refs/tags/v0.2.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 获取 RCB-01 历史提交
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mapfile -t revisions < <(
            python - <<'PY' | tr -d '\r'
          import json
          from pathlib import Path

          payload = json.loads(Path("scripts/rcb01_cases.json").read_text(encoding="utf-8"))
          revisions = {
              case[field]
              for case in payload["cases"]
              for field in ("base_revision", "candidate_revision")
          }
          print("\n".join(sorted(revisions)))
          PY
          )
          git fetch --no-tags --depth=1 origin "${revisions[@]}"

      - name: PR 编译与节点收集
        if: github.event_name == 'pull_request'
        run: |
          python -m compileall -q src scripts
          python -m pytest --collect-only -q

      - name: 主线与发布运行全量测试
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .tmp/pytest/runs
          python -m pytest -q \
            --timeout=58 \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=.tmp/pytest/runs/linux-py311

  tests-py312:
    name: Python 3.12 分片 ${{ matrix.name }}
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            test_timeout: 58
            files: tests/core
            extra_args: >-
              --ignore=tests/core/test_assurance_verification_semantics.py
              --ignore=tests/core/test_evidence_freshness.py
              --ignore=tests/core/test_finish_artifact_integrity.py
              --ignore=tests/core/test_smoke.py
              --ignore=tests/core/test_success_semantics.py
          - name: core-heavy
            test_timeout: 58
            files: >-
              tests/core/test_assurance_verification_semantics.py
              tests/core/test_evidence_freshness.py
              tests/core/test_finish_artifact_integrity.py
              tests/core/test_smoke.py
              tests/core/test_success_semantics.py
            extra_args: ""
          - name: supervisor
            test_timeout: 58
            files: tests/supervisor
            extra_args: ""
          - name: security
            test_timeout: 58
            files: tests/security
            extra_args: ""

    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 运行测试分片
        shell: bash
        run: |
          mkdir -p .tmp/pytest/runs
          python -m pytest -q \
            --timeout="${{ matrix.test_timeout }}" \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=".tmp/pytest/runs/linux-${{ matrix.name }}" \
            ${{ matrix.files }} ${{ matrix.extra_args }}

  tests-experimental:
    name: Python 3.12 实验与历史重放
    if: >-
      github.event_name != 'pull_request' ||
      needs.static.outputs.run_experimental == 'true'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 获取展示站发布证据 Tag
        shell: bash
        run: git fetch --no-tags origin refs/tags/v0.2.0:refs/tags/v0.2.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 获取 RCB-01 历史提交
        shell: bash
        run: |
          mapfile -t revisions < <(
            python - <<'PY' | tr -d '\r'
          import json
          from pathlib import Path

          payload = json.loads(Path("scripts/rcb01_cases.json").read_text(encoding="utf-8"))
          revisions = {
              case[field]
              for case in payload["cases"]
              for field in ("base_revision", "candidate_revision")
          }
          print("\n".join(sorted(revisions)))
          PY
          )
          git fetch --no-tags --depth=1 origin "${revisions[@]}"

      - name: 运行实验与冻结控制测试
        shell: bash
        run: |
          mkdir -p .tmp/pytest/runs
          python -m pytest -q \
            --timeout=58 \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=.tmp/pytest/runs/linux-experimental \
            tests/experimental tests/test_crwp_v1_control.py

  windows:
    name: Windows 专项与 wheel smoke
    needs: static
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试与构建依赖
        run: python -m pip install -e ".[dev]" pytest-timeout build

      - name: 运行 Windows 专项测试
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/pytest/runs | Out-Null
          python -m pytest -q `
            --timeout=58 `
            --timeout-method=thread `
            --durations=30 `
            --durations-min=0.20 `
            --basetemp=.tmp/pytest/runs/windows-boundaries `
            tests/security/test_adapter_realpath_boundary.py `
            tests/security/test_workspace_manifest_containment.py::test_parent_junction_does_not_read_outside_file `
            tests/security/test_runtime_safety_integration.py::test_windows_verification_preserves_nested_python_quotes `
            tests/security/test_project_config_hardening.py::test_windows_config_check_rejects_unsafe_cmd_grouping_and_single_pipe

          python -m pytest -q `
            --timeout=58 `
            --timeout-method=thread `
            --durations=30 `
            --durations-min=0.20 `
            --basetemp=.tmp/pytest/runs/windows-process-tree `
            tests/security/test_execution_control_safety.py `
            -k "windows or linked_descendant or revalidates_directory"

          python -m pytest -q `
            --timeout=58 `
            --timeout-method=thread `
            --durations=30 `
            --durations-min=0.20 `
            --basetemp=.tmp/pytest/runs/windows-lock `
            tests/security/test_run_mutation_lock.py

      - name: 构建并安装 Windows wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist
          python -m venv .tmp/release-validation/windows-venv
          $venvPython = Resolve-Path .tmp/release-validation/windows-venv/Scripts/python.exe
          & $venvPython -m pip install dist/vegaloom-0.3.1-py3-none-any.whl
          $vegaCli = Resolve-Path .tmp/release-validation/windows-venv/Scripts/vega.exe
          & $venvPython -m pip check
          $version = & $venvPython -I -c "import vega; print(vega.__version__)"
          if ($version.Trim() -ne "0.3.1") {
            throw "Windows wheel 版本不一致：$version"
          }
          & $venvPython -I -c "from vega.agent_handoff_digest import PORTABLE_WORKSPACE_DIGEST_KIND; assert PORTABLE_WORKSPACE_DIGEST_KIND == 'git-blob-v1'"
          & $venvPython -I -c "import importlib.util, vega; from vega.experimental.assurance import AdequacyResult; removed=('adapter_runtime','assurance','context_loader','eval','goal_evidence','goal_runtime','llm_client','loop_spec','memory','reviewer','runtime','state','tool_broker'); assert vega.__all__ == ['__version__']; assert all(importlib.util.find_spec(f'vega.{name}') is None for name in removed); print(AdequacyResult.__name__)"
          Push-Location $env:RUNNER_TEMP
          try {
            & $vegaCli --help | Out-Null
            $capabilities = (& $vegaCli capabilities) -join "`n" | ConvertFrom-Json
            if (
              $capabilities.provider -ne "codex-app-server" -or
              -not $capabilities.persistent_worker_thread -or
              $capabilities.reviewer_isolation -ne "per-work-item" -or
              $capabilities.automatic_commit_push_release
            ) {
              throw "Windows wheel 的 Agent 能力声明不符合 v0.3.1 合同"
            }
            $adapterRepo = Join-Path $env:RUNNER_TEMP "vega-adapter-smoke"
            New-Item -ItemType Directory -Force -Path $adapterRepo | Out-Null
            git -C $adapterRepo init | Out-Null
            & $vegaCli adapters init codex --repo $adapterRepo
            if (-not (Test-Path (Join-Path $adapterRepo ".agents/skills/vega-agent/SKILL.md"))) {
              throw "Windows wheel 未包含 vega-agent Skill"
            }
            if (
              (Test-Path (Join-Path $adapterRepo ".agents/skills/vega-loop")) -or
              (Test-Path (Join-Path $adapterRepo ".agents/skills/vega-review"))
            ) {
              throw "Windows wheel 仍会安装已删除的旧 Skill"
            }
          }
          finally {
            Pop-Location
          }

  posix:
    name: POSIX 临时目录专项
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 要求 POSIX 专项真实通过
        shell: bash
        run: |
          mkdir -p .tmp/pytest/runs .tmp/pytest/logs
          set +e
          python -m pytest -q -rs \
            --timeout=58 \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=.tmp/pytest/runs/linux-posix \
            tests/security/test_runtime_safety_integration.py::test_posix_verification_temp_env_does_not_re_evaluate_path \
            | tee .tmp/pytest/logs/linux-posix.log
          test_status="${PIPESTATUS[0]}"
          set -e
          test "$test_status" = "0"
          grep -q "1 passed" .tmp/pytest/logs/linux-posix.log
          if grep -q "skipped" .tmp/pytest/logs/linux-posix.log; then
            echo "POSIX 专项测试被跳过，不能作为 Linux 验证证据" >&2
            exit 1
          fi

  package:
    name: 构建并安装 wheel
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install build twine
          python -m build --outdir dist
          test -f dist/vegaloom-0.3.1-py3-none-any.whl
          test -f dist/vegaloom-0.3.1.tar.gz
          python -m twine check dist/*

      - name: 在干净环境安装并验证 wheel
        shell: bash
        run: |
          python -m venv .tmp/release-validation/venv
          .tmp/release-validation/venv/bin/python -m pip install dist/vegaloom-0.3.1-py3-none-any.whl
          .tmp/release-validation/venv/bin/python -m pip check
          test "$(
            .tmp/release-validation/venv/bin/python -I -c \
              "from importlib.metadata import version; print(version('vegaloom'))"
          )" = "0.3.1"
          test "$(
            .tmp/release-validation/venv/bin/python -I -c \
              "import vega; print(vega.__version__)"
          )" = "0.3.1"
          .tmp/release-validation/venv/bin/python -I -c \
            "from vega.agent_handoff_digest import PORTABLE_WORKSPACE_DIGEST_KIND; assert PORTABLE_WORKSPACE_DIGEST_KIND == 'git-blob-v1'"
          .tmp/release-validation/venv/bin/python -I -c \
            "import importlib.util, vega; from vega.experimental.assurance import AdequacyResult; removed=('adapter_runtime','assurance','context_loader','eval','goal_evidence','goal_runtime','llm_client','loop_spec','memory','reviewer','runtime','state','tool_broker'); assert vega.__all__ == ['__version__']; assert all(importlib.util.find_spec(f'vega.{name}') is None for name in removed); print(AdequacyResult.__name__)"
          test "$(.tmp/release-validation/venv/bin/vega --version)" = "0.3.1"
          .tmp/release-validation/venv/bin/vega --help >/dev/null

          vega_cli="${GITHUB_WORKSPACE}/.tmp/release-validation/venv/bin/vega"
          "$vega_cli" capabilities \
            > .tmp/release-validation/capabilities.json
          .tmp/release-validation/venv/bin/python -I - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(".tmp/release-validation/capabilities.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["provider"] == "codex-app-server"
          assert payload["persistent_worker_thread"] is True
          assert payload["reviewer_isolation"] == "per-work-item"
          assert payload["automatic_commit_push_release"] is False
          PY

          adapter_repo="$(mktemp -d)"
          git -C "$adapter_repo" init >/dev/null
          "$vega_cli" adapters init codex --repo "$adapter_repo"
          test -f "$adapter_repo/.agents/skills/vega-agent/SKILL.md"
          test ! -e "$adapter_repo/.agents/skills/vega-loop"
          test ! -e "$adapter_repo/.agents/skills/vega-review"

      - name: 从已安装 wheel 验证 POSIX run lock
        shell: bash
        run: |
          .tmp/release-validation/venv/bin/python -I - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from vega.run_lock import RunMutationLock

          with TemporaryDirectory() as temp_dir:
              run_dir = Path(temp_dir) / "run"
              run_dir.mkdir()
              with RunMutationLock.acquire(run_dir, "loop.start"):
                  pass
          PY

      - name: 在第二个干净环境安装 sdist
        shell: bash
        run: |
          python -m venv .tmp/release-validation/sdist-venv
          .tmp/release-validation/sdist-venv/bin/python -m pip install \
            dist/vegaloom-0.3.1.tar.gz
          .tmp/release-validation/sdist-venv/bin/python -m pip check
          test "$(
            .tmp/release-validation/sdist-venv/bin/python -I -c \
              "import vega; print(vega.__version__)"
          )" = "0.3.1"
          .tmp/release-validation/sdist-venv/bin/python -I -c \
            "from vega.agent_handoff_digest import PORTABLE_WORKSPACE_DIGEST_KIND; assert PORTABLE_WORKSPACE_DIGEST_KIND == 'git-blob-v1'"
          .tmp/release-validation/sdist-venv/bin/python -I -c \
            "import importlib.util, vega; removed=('adapter_runtime','assurance','context_loader','eval','goal_evidence','goal_runtime','llm_client','loop_spec','memory','reviewer','runtime','state','tool_broker'); assert vega.__all__ == ['__version__']; assert all(importlib.util.find_spec(f'vega.{name}') is None for name in removed)"
