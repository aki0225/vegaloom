name: 持续集成

"on":
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  static:
    name: 静态检查与分片覆盖
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"

      - name: 编译与静态检查
        run: |
          python -m compileall src scripts/check_repository_hygiene.py scripts/check_architecture_growth.py scripts/build_showcase_data.py scripts/rcb01_materializer.py scripts/run_assurance_stage2_sqlite_experiment.py scripts/run_assurance_stage2_expand_contract_experiment.py scripts/run_assurance_stage3_dml_backfill_experiment.py
          ruff check src tests scripts/check_repository_hygiene.py scripts/check_architecture_growth.py scripts/build_showcase_data.py scripts/rcb01_materializer.py scripts/run_assurance_stage2_sqlite_experiment.py scripts/run_assurance_stage2_expand_contract_experiment.py scripts/run_assurance_stage3_dml_backfill_experiment.py

      - name: 检查仓库路径与私密文件卫生
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            python scripts/check_repository_hygiene.py --base-ref "$base_sha"
          else
            python scripts/check_repository_hygiene.py
          fi

      - name: 检查架构复杂度与实验依赖增量
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            python scripts/check_architecture_growth.py --base-ref "$base_sha"
          else
            python scripts/check_architecture_growth.py --base-ref HEAD
          fi

      - name: 检查本次提交范围的空白错误
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before_sha="${{ github.event.before }}"
          base_sha=""
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" && -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]]; then
            base_sha="$before_sha"
          fi

          if [[ -n "$base_sha" ]]; then
            git diff --check "${base_sha}..HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: 核对 Python 3.12 分片覆盖全部测试文件
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(Path(".github/workflows/ci.yml").read_text(encoding="utf-8"))
          shards = workflow["jobs"]["tests-py312"]["strategy"]["matrix"]["include"]
          listed = [
              file_name
              for shard in shards
              for file_name in str(shard["files"]).split()
          ]
          actual = sorted(path.as_posix() for path in Path("tests").glob("test_*.py"))
          counts = Counter(listed)
          duplicates = sorted(path for path, count in counts.items() if count > 1)
          missing = sorted(set(actual) - set(listed))
          unexpected = sorted(set(listed) - set(actual))
          if duplicates or missing or unexpected:
              raise SystemExit(
                  "Python 3.12 分片文件集合不完整："
                  f"duplicates={duplicates}, missing={missing}, unexpected={unexpected}"
              )
          print(f"Python 3.12 分片完整覆盖 {len(actual)} 个测试文件")
          PY

  tests-py311:
    name: Python 3.11 兼容性
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 获取 RCB-01 历史提交
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mapfile -t revisions < <(
            python - <<'PY' | tr -d '\r'
          import json
          from pathlib import Path

          payload = json.loads(Path("scripts/rcb01_cases.json").read_text(encoding="utf-8"))
          revisions = {
              case[field]
              for case in payload["cases"]
              for field in ("base_revision", "candidate_revision")
          }
          print("\n".join(sorted(revisions)))
          PY
          )
          git fetch --no-tags --depth=1 origin "${revisions[@]}"

      - name: PR 编译与节点收集
        if: github.event_name == 'pull_request'
        run: |
          python -m compileall -q src scripts
          python -m pytest --collect-only -q

      - name: 主线与发布运行全量测试
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .tmp/pytest/runs
          python -m pytest -q \
            --timeout=58 \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=.tmp/pytest/runs/linux-py311

  tests-py312:
    name: Python 3.12 分片 ${{ matrix.name }}
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-cli
            test_timeout: 58
            files: >-
              tests/test_smoke.py
              tests/test_p0_regressions.py
              tests/test_cli_recovery_hardening.py
              tests/test_cli_progress.py
              tests/test_long_task_controller.py
              tests/test_run_mutation_lock.py
              tests/test_redaction.py
          - name: execution-artifacts
            test_timeout: 58
            files: >-
              tests/test_adapter_realpath_boundary.py
              tests/test_execution_control_safety.py
              tests/test_finish_artifact_integrity.py
              tests/test_recovery_chaos.py
              tests/test_repository_hygiene.py
              tests/test_runtime_safety_integration.py
              tests/test_security_evidence.py
              tests/test_workspace_baseline.py
              tests/test_workspace_manifest_containment.py
              tests/test_workspace_snapshot_budget.py
              tests/test_context_boundaries.py
          - name: semantics-review
            test_timeout: 58
            files: >-
              tests/test_success_semantics.py
              tests/test_finish_policy.py
              tests/test_evidence_freshness.py
              tests/test_review_artifact_integrity.py
              tests/test_required_risk_review_loop.py
              tests/test_required_risk_review_runtime.py
              tests/test_required_risk_reviews.py
              tests/test_risk_review_contract.py
              tests/test_gate_path_matching.py
              tests/test_path_and_eval_contract.py
          - name: config-assurance-pilot
            test_timeout: 58
            files: >-
              tests/test_project_config_hardening.py
              tests/test_architecture_growth.py
              tests/test_crwp_v1_control.py
              tests/test_showcase_data.py
              tests/test_assurance_verification_semantics.py
              tests/test_assurance_stage1_contract.py
              tests/test_assurance_stage2_sqlite_experiment.py
              tests/test_assurance_stage2_expand_contract_experiment.py
              tests/test_assurance_stage3_dml_backfill_experiment.py
              tests/test_rcb01_materializer.py

    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 获取 RCB-01 历史提交
        if: matrix.name == 'config-assurance-pilot'
        shell: bash
        run: |
          mapfile -t revisions < <(
            python - <<'PY' | tr -d '\r'
          import json
          from pathlib import Path

          payload = json.loads(Path("scripts/rcb01_cases.json").read_text(encoding="utf-8"))
          revisions = {
              case[field]
              for case in payload["cases"]
              for field in ("base_revision", "candidate_revision")
          }
          print("\n".join(sorted(revisions)))
          PY
          )
          git fetch --no-tags --depth=1 origin "${revisions[@]}"

      - name: 运行测试分片
        shell: bash
        run: |
          mkdir -p .tmp/pytest/runs
          python -m pytest -q \
            --timeout="${{ matrix.test_timeout }}" \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=".tmp/pytest/runs/linux-${{ matrix.name }}" \
            ${{ matrix.files }}

  windows:
    name: Windows 专项与 wheel smoke
    needs: static
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试与构建依赖
        run: python -m pip install -e ".[dev]" pytest-timeout build

      - name: 运行 Windows 专项测试
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/pytest/runs | Out-Null
          python -m pytest -q `
            --timeout=58 `
            --timeout-method=thread `
            --durations=30 `
            --durations-min=0.20 `
            --basetemp=.tmp/pytest/runs/windows-boundaries `
            tests/test_adapter_realpath_boundary.py `
            tests/test_workspace_manifest_containment.py::test_parent_junction_does_not_read_outside_file `
            tests/test_runtime_safety_integration.py::test_windows_verification_preserves_nested_python_quotes `
            tests/test_project_config_hardening.py::test_windows_config_check_rejects_unsafe_cmd_grouping_and_single_pipe

          python -m pytest -q `
            --timeout=58 `
            --timeout-method=thread `
            --durations=30 `
            --durations-min=0.20 `
            --basetemp=.tmp/pytest/runs/windows-process-tree `
            tests/test_execution_control_safety.py `
            -k "windows or linked_descendant or revalidates_directory"

          python -m pytest -q `
            --timeout=58 `
            --timeout-method=thread `
            --durations=30 `
            --durations-min=0.20 `
            --basetemp=.tmp/pytest/runs/windows-lock `
            tests/test_run_mutation_lock.py

      - name: 构建并安装 Windows wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist
          python -m venv .tmp/release-validation/windows-venv
          $venvPython = Resolve-Path .tmp/release-validation/windows-venv/Scripts/python.exe
          & $venvPython -m pip install dist/vegaloom-0.1.5-py3-none-any.whl
          $vegaCli = Resolve-Path .tmp/release-validation/windows-venv/Scripts/vega.exe
          & $venvPython -m pip check
          $version = & $venvPython -I -c "import vega; print(vega.__version__)"
          if ($version.Trim() -ne "0.1.5") {
            throw "Windows wheel 版本不一致：$version"
          }
          & $venvPython -I -c "import importlib.util, vega; from vega.experimental.assurance import AdequacyResult; removed=('adapter_runtime','assurance','context_loader','eval','goal_evidence','goal_runtime','llm_client','loop_spec','memory','reviewer','runtime','state','tool_broker'); assert vega.__all__ == ['__version__']; assert all(importlib.util.find_spec(f'vega.{name}') is None for name in removed); print(AdequacyResult.__name__)"
          Push-Location $env:RUNNER_TEMP
          try {
            $loops = & $vegaCli list-loops
            if (($loops -join "`n") -notmatch "engineering-change") {
              throw "Windows wheel 未包含 engineering-change loop"
            }
          }
          finally {
            Pop-Location
          }

  posix:
    name: POSIX 临时目录专项
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]" pytest-timeout

      - name: 要求 POSIX 专项真实通过
        shell: bash
        run: |
          mkdir -p .tmp/pytest/runs .tmp/pytest/logs
          set +e
          python -m pytest -q -rs \
            --timeout=58 \
            --timeout-method=signal \
            --durations=30 \
            --durations-min=0.20 \
            --basetemp=.tmp/pytest/runs/linux-posix \
            tests/test_runtime_safety_integration.py::test_posix_verification_temp_env_does_not_re_evaluate_path \
            | tee .tmp/pytest/logs/linux-posix.log
          test_status="${PIPESTATUS[0]}"
          set -e
          test "$test_status" = "0"
          grep -q "1 passed" .tmp/pytest/logs/linux-posix.log
          if grep -q "skipped" .tmp/pytest/logs/linux-posix.log; then
            echo "POSIX 专项测试被跳过，不能作为 Linux 验证证据" >&2
            exit 1
          fi

  package:
    name: 构建并安装 wheel
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install build twine
          python -m build --outdir dist
          test -f dist/vegaloom-0.1.5-py3-none-any.whl
          test -f dist/vegaloom-0.1.5.tar.gz
          python -m twine check dist/*

      - name: 在干净环境安装并验证 wheel
        shell: bash
        run: |
          python -m venv .tmp/release-validation/venv
          .tmp/release-validation/venv/bin/python -m pip install dist/vegaloom-0.1.5-py3-none-any.whl
          .tmp/release-validation/venv/bin/python -m pip check
          test "$(
            .tmp/release-validation/venv/bin/python -I -c \
              "from importlib.metadata import version; print(version('vegaloom'))"
          )" = "0.1.5"
          test "$(
            .tmp/release-validation/venv/bin/python -I -c \
              "import vega; print(vega.__version__)"
          )" = "0.1.5"
          .tmp/release-validation/venv/bin/python -I -c \
            "import importlib.util, vega; from vega.experimental.assurance import AdequacyResult; removed=('adapter_runtime','assurance','context_loader','eval','goal_evidence','goal_runtime','llm_client','loop_spec','memory','reviewer','runtime','state','tool_broker'); assert vega.__all__ == ['__version__']; assert all(importlib.util.find_spec(f'vega.{name}') is None for name in removed); print(AdequacyResult.__name__)"
          test "$(.tmp/release-validation/venv/bin/vega --version)" = "0.1.5"
          .tmp/release-validation/venv/bin/vega --help >/dev/null

          empty_workspace="$(mktemp -d)"
          pushd "$empty_workspace"
          vega_cli="${GITHUB_WORKSPACE}/.tmp/release-validation/venv/bin/vega"
          "$vega_cli" list-loops | tee loops.txt
          grep -q "engineering-change" loops.txt
          popd

      - name: 从已安装 wheel 验证 POSIX run lock
        shell: bash
        run: |
          .tmp/release-validation/venv/bin/python -I - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from vega.run_lock import RunMutationLock

          with TemporaryDirectory() as temp_dir:
              run_dir = Path(temp_dir) / "run"
              run_dir.mkdir()
              with RunMutationLock.acquire(run_dir, "loop.start"):
                  pass
          PY

      - name: 在第二个干净环境安装 sdist
        shell: bash
        run: |
          python -m venv .tmp/release-validation/sdist-venv
          .tmp/release-validation/sdist-venv/bin/python -m pip install \
            dist/vegaloom-0.1.5.tar.gz
          .tmp/release-validation/sdist-venv/bin/python -m pip check
          test "$(
            .tmp/release-validation/sdist-venv/bin/python -I -c \
              "import vega; print(vega.__version__)"
          )" = "0.1.5"
          .tmp/release-validation/sdist-venv/bin/python -I -c \
            "import importlib.util, vega; removed=('adapter_runtime','assurance','context_loader','eval','goal_evidence','goal_runtime','llm_client','loop_spec','memory','reviewer','runtime','state','tool_broker'); assert vega.__all__ == ['__version__']; assert all(importlib.util.find_spec(f'vega.{name}') is None for name in removed)"
