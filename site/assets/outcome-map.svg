<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="520"
  viewBox="0 0 1120 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Vega 三种 Finish 结局</title>
  <desc id="desc">
    完整且新鲜的证据进入 ready_to_commit，Reviewer 找到具体问题进入 request_changes，
    验证失败、超时、高风险或证据不足进入 needs_human。
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#332d28"/>
    </marker>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#9e8c76" opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1118" height="518" rx="5" fill="#faf5eb" stroke="#9e8c76"/>
  <rect x="16" y="16" width="1088" height="488" fill="url(#dots)"/>

  <g transform="translate(52 164)">
    <rect x="7" y="8" width="242" height="168" fill="#d4552d" opacity="0.13"/>
    <rect x="0" y="0" width="242" height="168" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <text x="24" y="35" fill="#9e321d" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      FINISH CHECK
    </text>
    <text x="24" y="73" fill="#201c18" font-family="Songti SC, serif" font-size="24" font-weight="700">
      现在拥有什么证据？
    </text>
    <path d="M24 93 H218" stroke="#cbbba7" stroke-width="1"/>
    <text x="24" y="119" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="12">
      实际 Diff · Gate · 验证结果
    </text>
    <text x="24" y="143" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="12">
      Reviewer 意见 · 完整性 · 新鲜度
    </text>
  </g>

  <path d="M306 248 H384" fill="none" stroke="#332d28" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="406" cy="248" r="22" fill="#f3ecdf" stroke="#332d28" stroke-width="1.5"/>
  <text x="406" y="253" text-anchor="middle" fill="#201c18" font-family="Songti SC, serif" font-size="18" font-weight="700">看</text>

  <path d="M428 248 C490 248, 492 96, 552 96" fill="none" stroke="#3f7f55" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M428 248 H552" fill="none" stroke="#ae4437" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M428 248 C490 248, 492 400, 552 400" fill="none" stroke="#b66d24" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="476" y="86" fill="#3f7f55" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="700">
    证据完整且一致
  </text>
  <text x="463" y="237" fill="#ae4437" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="700">
    找到具体问题
  </text>
  <text x="466" y="390" fill="#b66d24" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="700">
    失败、超时或证据不足
  </text>

  <g transform="translate(566 36) rotate(-1 239 66)">
    <rect x="7" y="8" width="478" height="132" fill="#3f7f55" opacity="0.16"/>
    <rect x="0" y="0" width="478" height="132" fill="#fffaf0" stroke="#3f7f55" stroke-width="2"/>
    <circle cx="35" cy="34" r="13" fill="#3f7f55"/>
    <path d="M29 34 L33 38 L42 29" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="41" fill="#316641" font-family="Cascadia Code, monospace" font-size="20" font-weight="700">
      ready_to_commit
    </text>
    <text x="28" y="78" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      可以人工检查后提交
    </text>
    <text x="28" y="105" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="12">
      不是自动合并许可；提交动作仍由人决定。
    </text>
  </g>

  <g transform="translate(566 186) rotate(1 239 66)">
    <rect x="7" y="8" width="478" height="132" fill="#ae4437" opacity="0.14"/>
    <rect x="0" y="0" width="478" height="132" fill="#fffaf0" stroke="#ae4437" stroke-width="2"/>
    <circle cx="35" cy="34" r="13" fill="#ae4437"/>
    <path d="M30 29 L40 39 M40 29 L30 39" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="62" y="41" fill="#8a342b" font-family="Cascadia Code, monospace" font-size="20" font-weight="700">
      request_changes
    </text>
    <text x="28" y="78" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      Reviewer 找到问题，继续修改
    </text>
    <text x="28" y="105" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="12">
      保留具体 finding 和证据，下一轮只处理已确认的问题。
    </text>
  </g>

  <g transform="translate(566 336) rotate(-1 239 66)">
    <rect x="7" y="8" width="478" height="132" fill="#b66d24" opacity="0.16"/>
    <rect x="0" y="0" width="478" height="132" fill="#fffaf0" stroke="#b66d24" stroke-width="2"/>
    <path d="M35 20 L50 47 H20 Z" fill="#b66d24"/>
    <rect x="33.5" y="29" width="3" height="9" fill="#fff"/>
    <circle cx="35" cy="42" r="1.7" fill="#fff"/>
    <text x="62" y="41" fill="#8f511b" font-family="Cascadia Code, monospace" font-size="20" font-weight="700">
      needs_human
    </text>
    <text x="28" y="78" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      停下来，保留现场
    </text>
    <text x="28" y="105" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="12">
      不猜、不掩盖、不硬跑；由人决定下一步。
    </text>
  </g>
</svg>
