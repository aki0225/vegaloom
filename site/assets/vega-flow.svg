<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="650"
  viewBox="0 0 760 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Vega 六个检查点流程草图</title>
  <desc id="desc">
    Baseline 固定现场，Worker 留下真实 Diff，Gates 检查范围与风险，Verify 运行项目验证，
    Reviewer 从新会话读取证据，Finish 给出结论，最后由人决定是否提交。
  </desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#cabaa7" stroke-width="0.7" opacity="0.42"/>
    </pattern>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10Z" fill="#332d28"/>
    </marker>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018"
        numOctaves="1"
        seed="8"
        result="noise"
      />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="648" rx="6" fill="#faf5eb" stroke="#9e8c76"/>
  <rect x="16" y="16" width="728" height="618" fill="url(#grid)"/>

  <text x="42" y="58" fill="#72695f" font-family="Cascadia Code, monospace" font-size="13" font-weight="700">
    VEGA / SIX CHECKPOINTS
  </text>
  <text x="718" y="58" fill="#72695f" font-family="Cascadia Code, monospace" font-size="12" text-anchor="end">
    v0.1.4
  </text>
  <path d="M42 72H718" fill="none" stroke="#9e8c76" stroke-width="1"/>

  <g filter="url(#rough)" fill="none" stroke="#332d28" stroke-width="2" stroke-dasharray="7 5">
    <path d="M230 158C315 158 340 158 422 158" marker-end="url(#arrow)"/>
    <path d="M550 208C550 244 602 248 608 282" marker-end="url(#arrow)"/>
    <path d="M512 350H483" marker-end="url(#arrow)"/>
    <path d="M277 350H248" marker-end="url(#arrow)"/>
    <path d="M145 410C145 449 185 456 185 482" marker-end="url(#arrow)"/>
    <path d="M298 542H447" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(55 112) rotate(-1 88 48)">
    <rect x="6" y="7" width="175" height="96" fill="#5279a8" opacity="0.18"/>
    <rect width="175" height="96" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#5279a8"/>
    <text x="43" y="29" fill="#5279a8" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      01 BASELINE
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      固定现场
    </text>
    <text x="20" y="80" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="11">
      HEAD · 工作区 · 项目策略
    </text>
  </g>

  <g transform="translate(430 110) rotate(1 120 50)">
    <rect x="7" y="8" width="240" height="100" fill="#d86f31" opacity="0.18"/>
    <rect width="240" height="100" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#d86f31"/>
    <text x="43" y="29" fill="#b34c21" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      02 WORKER
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      留下真实 Diff
    </text>
    <text x="20" y="81" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="11">
      不采信“已经改好”的口头结论
    </text>
  </g>

  <g transform="translate(520 290) rotate(1 95 60)">
    <rect x="7" y="8" width="190" height="120" fill="#c89a2f" opacity="0.18"/>
    <rect width="190" height="120" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <rect x="18" y="17" width="12" height="12" fill="#c89a2f"/>
    <text x="43" y="29" fill="#8c6a14" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      03 GATES
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="19" font-weight="700">
      范围与风险
    </text>
    <path d="M20 75H170" stroke="#cbbba7" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="20" y="96" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="10.5">
      Workspace · Scope
    </text>
    <text x="20" y="112" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="10.5">
      Risk
    </text>
  </g>

  <g transform="translate(285 290) rotate(-1 95 60)">
    <rect x="7" y="8" width="190" height="120" fill="#2f8d86" opacity="0.17"/>
    <rect width="190" height="120" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#2f8d86"/>
    <text x="43" y="29" fill="#246e68" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      04 VERIFY
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="19" font-weight="700">
      跑项目验证
    </text>
    <path d="M20 75H170" stroke="#cbbba7" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="27" cy="96" r="6" fill="#2f8d86"/>
    <path d="M24 96L27 99L32 92" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="42" y="100" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="10.5">
      命令实际运行
    </text>
  </g>

  <g transform="translate(50 290) rotate(1 95 60)">
    <rect x="7" y="8" width="190" height="120" fill="#a65679" opacity="0.16"/>
    <rect width="190" height="120" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#a65679"/>
    <text x="43" y="29" fill="#87415f" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      05 REVIEW
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="19" font-weight="700">
      从新会话开始
    </text>
    <text x="20" y="83" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="10.5">
      任务 · Diff · 测试 · 规则
    </text>
    <text x="20" y="104" fill="#a65679" font-family="Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700">
      不接着 Worker 对话往下说
    </text>
  </g>

  <g transform="translate(80 490) rotate(-1 105 52)">
    <rect x="7" y="8" width="210" height="104" fill="#3f7f55" opacity="0.17"/>
    <rect width="210" height="104" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#3f7f55"/>
    <text x="43" y="29" fill="#316641" font-family="Cascadia Code, monospace" font-size="12" font-weight="700">
      06 FINISH
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      给出明确结论
    </text>
    <text x="20" y="82" fill="#72695f" font-family="Microsoft YaHei, sans-serif" font-size="10.5">
      完整性 · 新鲜度 · 下一步
    </text>
  </g>

  <g transform="translate(455 490) rotate(1 115 52)">
    <rect x="7" y="8" width="230" height="104" fill="#d4552d" opacity="0.14"/>
    <rect width="230" height="104" fill="#fffaf0" stroke="#332d28" stroke-width="1.5"/>
    <text x="20" y="29" fill="#72695f" font-family="Cascadia Code, monospace" font-size="11" font-weight="700">
      HUMAN DECIDES
    </text>
    <text x="20" y="59" fill="#201c18" font-family="Songti SC, serif" font-size="20" font-weight="700">
      你看证据，再决定
    </text>
    <text x="20" y="82" fill="#d4552d" font-family="Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700">
      Vega 不自动 commit / push / release
    </text>
  </g>

  <path d="M295 228C345 213 389 214 431 227" fill="none" stroke="#d4552d" stroke-width="2"/>
  <text x="364" y="209" fill="#9e321d" font-family="Songti SC, serif" font-size="14" text-anchor="middle">
    证据是共同语言
  </text>
</svg>
