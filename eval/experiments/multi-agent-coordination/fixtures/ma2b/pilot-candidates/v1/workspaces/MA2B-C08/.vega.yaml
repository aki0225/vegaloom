version: 1
scope:
  allowed_paths:
    - pyproject.toml
    - src/vega/project_profile.py
    - src/vega/repository_identity.py
    - tests/test_tracked_profile_identity.py
verification:
  commands:
    - python -m pytest -q tests/test_tracked_profile_identity.py
  max_commands: 1
budget:
  max_changed_files: 2
  max_diff_lines: 260
  max_new_files: 1
