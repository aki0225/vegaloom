version: 1
scope:
  allowed_paths:
    - pyproject.toml
    - src/vega/cli.py
    - src/vega/cli_support.py
    - tests/test_cli_repo_directory_guard.py
verification:
  commands:
    - python -m pytest -q tests/test_cli_repo_directory_guard.py
  max_commands: 1
budget:
  max_changed_files: 1
  max_diff_lines: 120
  max_new_files: 0
