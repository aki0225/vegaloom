version: 1
scope:
  allowed_paths:
    - pyproject.toml
    - src/vega/delegation.py
    - src/vega/ma2b_execution_binding.py
    - src/vega/ma2b_pricing_manifest.py
    - src/vega/redaction.py
    - tests/test_pricing_binding_contract.py
verification:
  commands:
    - python -m pytest -q tests/test_pricing_binding_contract.py
  max_commands: 1
budget:
  max_changed_files: 2
  max_diff_lines: 520
  max_new_files: 1
