version: 1
scope:
  allowed_paths:
    - pyproject.toml
    - src/vega/execution_control.py
    - src/vega/execution_feedback.py
    - tests/test_bounded_execution_progress_contract.py
verification:
  commands:
    - python -m pytest -q tests/test_bounded_execution_progress_contract.py
  max_commands: 1
budget:
  max_changed_files: 2
  max_diff_lines: 180
  max_new_files: 1
